        content: '';

        inset: 2px;
        background: rgba(0, 0, 0, 0.9);
        border-radius: 28px;
        z-index: -1;
      }
      
      @keyframes rotateBorder {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }

      @keyframes fadeInUp {

/* ===== EFEK KILATAN (SHIMMER) BARU: BEBAS KEDIP ===== */
.glow-on-hover {
  position: relative;
  overflow: hidden;
  /* Memaksa browser mengaktifkan akselerasi perangkat keras (Hardware Acceleration) */
  transform: translate3d(0, 0, 0); 
}

.glow-on-hover::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    90deg,
    rgba(255, 255, 255, 0) 0%,
    rgba(255, 255, 255, 0.4) 50%,
    rgba(255, 255, 255, 0) 100%
  );
  /* Menggunakan transform miring sejak awal */
  transform: translateX(-100%) skewX(-30deg); 
  /* Animasi menggunakan transform (sangat ringan untuk web AMP) */
  animation: shine-clean 3.5s infinite ease-in-out; 
}

/* Animasi kilat yang jalurnya mulus dan tidak merusak layout tombol */

  0% { transform: translateX(-150%) skewX(-30deg); }
  20% { transform: translateX(150%) skewX(-30deg); }
